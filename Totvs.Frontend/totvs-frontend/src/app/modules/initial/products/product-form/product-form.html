<mat-card>
  <h2>{{ isEdit ? 'Editar Produto' : 'Novo Produto' }}</h2>

  <form [formGroup]="form" (ngSubmit)="save()">

    <mat-form-field appearance="outline" class="full">
      <mat-label>Nome</mat-label>
      <input matInput formControlName="name">
      <mat-error *ngIf="f['name'].touched && f['name'].invalid">
        Nome é obrigatório e deve ter até 100 caracteres.
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full">
      <mat-label>Descrição</mat-label>
      <textarea matInput formControlName="description"></textarea>
    </mat-form-field>

    <mat-form-field appearance="outline" class="half">
      <mat-label>Preço</mat-label>
      <input matInput type="number" formControlName="price">
    </mat-form-field>

    <mat-form-field appearance="outline" class="half">
      <mat-label>Estoque</mat-label>
      <input matInput type="number" formControlName="stockQuantity">
    </mat-form-field>

    <mat-checkbox formControlName="active">Ativo</mat-checkbox>

    <div class="actions">
      <button mat-raised-button color="primary" type="submit">
        {{ isEdit ? 'Salvar' : 'Criar' }}
      </button>

      <button mat-raised-button color="warn" type="button" (click)="cancel()">
        Cancelar
      </button>
    </div>

  </form>
</mat-card>
